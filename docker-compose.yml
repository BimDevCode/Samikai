  #     - certificates:/etc/certificates
  #     - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
  #     - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  #   networks:
  #     - app-network

  conbent.identity.api:
    image: ${DOCKER_REGISTRY-}conbentidentityapi
    build:
      context: .
      dockerfile: src/Microservices/Accounts/Identity.API/Dockerfile
    ports:
      - "5223:5223"
    environment:
      - ConnectionStrings__IdentityDB=Host=postgresql;Port=5432;UserId=postgres;Password=Tootyfrooty99;Database=ConbentUsers;Include Error Detail=true;
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - ASPNETCORE_HTTP_PORTS=5223
    depends_on:
      - postgresql
    volumes:
      - ~/.vsdbg:/remote_debugger:rw # Mount the debugger directory
      #- ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro #windows
      - ${HOME}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro #Mac
    networks:
      - app-network

  # conbent.userinteraction.api:
  #   image: ${DOCKER_REGISTRY-}conbentuserinteractionapi
  #   build:
  #     context: .
  #     dockerfile: src/Microservices/Accounts/UserInteraction.API/Dockerfile
  #   environment:

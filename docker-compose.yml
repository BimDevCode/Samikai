  angular-app:
    build:
      context: .
      dockerfile: src/Clients/AngularApp/Dockerfile
    ports:
      - "5211:5211"  # Ensure the port matches your Angular serve command
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    
volumes:
  storage:
  #certificates:
  # rabbitmq_data:
  #    driver: local
  postgres_data:
    driver: local

secrets:
  server.cert:
    file: ./server.cert
  server.key:
    file: ./server.key


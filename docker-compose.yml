services:
  postgresql:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tootyfrooty99
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
     
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   ports:
  #     - "5672:5672"  # RabbitMQ server
  #     - "15672:15672"  # Management console
  #   volumes:
  #     - "rabbitmq_data:/var/lib/rabbitmq"
  #   environment:
  #     - RABBITMQ_HOST=rabbitmq
  #   networks:
  #     - app-network
   
  redis:
    image: redis:latest
    ports:
      - "6379:6379"   
    networks:
      - app-network 
    environment:
      - REDIS_PASSWORD=password21
    command: ["redis-server", "--requirepass", "password21"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password21", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # redisinsight:
  #   image: redislabs/redisinsight:latest
  #   ports:
  #     - "6380:6380"
  #   depends_on:
  #     - redis

  conbent.article.api:
    image: ${DOCKER_REGISTRY-}conbentarticleapi
    build:
      context: .
      dockerfile: src/Microservices/Article/Conbent.Article.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgresql;Port=5432;UserId=postgres;Password=Tootyfrooty99;Database=ConbentArticles;Include Error Detail=true;
      - ASPNETCORE_HTTPS_PORTS=7069
      - ASPNETCORE_URLS=https://+:7069;
      - RABBITMQ_HOST=rabbitmq
      - ConnectionStrings__RedisConnection=redis:6379,password=password21
      # - ASPNETCORE_Kestrel__Certificates__Default__Path=/cert/conbentapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/src/cert/conbentapp.pfx #windows
      - ASPNETCORE_Kestrel__Certificates__Default__Password=ConbentPassword
    depends_on:
      - postgresql
      - redis
    ports:
      - "7069:7069"
    volumes:
      #- ${HOME}/.aspnet/https:/root/.aspnet/https:ro
      - ${APPDATA}/.aspnet/https:/root/.aspnet/https:ro #Windows
      - ~/.vsdbg:/remote_debugger:rw # Mount the debugger directory
 
      - storage:/storage
      - /var/run/docker.sock:/tmp/docker.sock:ro
      #- certificates:/etc/certificates

      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro #Windows
      #- ${HOME}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro #Mac
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro #Windows
      #- ${HOME}/.aspnet/dev-certs/https:/root/.aspnet/https:ro #Mac
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:7069/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # conbent.proxy:
  #   image: ${DOCKER_REGISTRY-}conbentproxy
  #   build:
  #     context: .
  #     dockerfile: src/Microservices/Gateways/Conbent.AngularClientGateway/Dockerfile
  #   environment:

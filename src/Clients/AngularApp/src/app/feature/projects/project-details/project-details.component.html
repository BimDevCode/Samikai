<div class="grid">
  <div class="col-12 md:col-4 ">
    <div class="card p-2">
      <div class="flex flex-column align-items-center text-center mb-3">
        <img [src]="project?.image" [alt]="project?.name" class="w-full my-3 mx-0" style="border-radius: 10px;"/>
        <div class="text-2xl font-bold text-white">{{project?.name}}</div>
      </div>
    </div>
  </div>
  <div class="col-12 md:col-8">
    <div class="card mb-3 h-full">
      <div class="mt-1 ">
        <span class="text-white text-3xl">Descritprion</span>
        <div class="row mt-2">
          <span class="text-white text-l ">
            {{project?.text}}
          </span>
        </div>

        <div *ngIf="project!.tag && project!.tag.name !== ''" class="flex align-items-center mt-4" >
          <a (click)="onTagSelected(project!.tag.name)" class="cursor-pointer">
            <span class="text-900 surface-100 inline-flex font-semibold py-2 px-3 mr-2 border-round" [innerHTML]="project!.tag.name" ></span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12" *ngIf="project!.gitLink !== ''">
    <div class="card p-4 ">
      <div>
        <div class="text-center ">
          <span class="text-xl text-white mt-1">Open source link: <a class="brace-hover" href="{{project!.gitLink}}">github</a></span>
        </div>
      </div>
      <!-- <div class="mt-1" *ngFor="let article in project?.articles">
        <div class="row mt-2">
          {{article.name}}
        </div>
      </div> -->
    </div>
  </div>
  <div class="col-12">
    <app-comment [article]="this.project!.representArticle" *ngIf="this.project!.representArticle" ></app-comment>
  </div>

</div>
